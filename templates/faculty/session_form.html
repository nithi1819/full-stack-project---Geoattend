{% extends "base.html" %}
{% block title %}Create Session - Faculty{% endblock %}
{% block page_title %}Create Attendance Session{% endblock %}

{% block content %}
<div class="content-wrapper">
    <div class="card" style="max-width: 700px;">
        <div class="card-header">
            <h2>New Attendance Session</h2>
        </div>
        <div class="card-body">
            <form method="POST" class="form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="class_name">Class Name *</label>
                        <input type="text" id="class_name" name="class_name" required value="{{ form.get('class_name', '') if form else '' }}" placeholder="e.g., CS-301">
                    </div>
                    <div class="form-group">
                        <label for="course_name">Course Name</label>
                        <input type="text" id="course_name" name="course_name" value="{{ form.get('course_name', '') if form else '' }}" placeholder="e.g., Data Structures">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="session_date">Session Date *</label>
                        <input type="date" id="session_date" name="session_date" required value="{{ form.get('session_date', '') if form else '' }}">
                    </div>
                    <div class="form-group">
                        <label for="qr_expiry_minutes">QR Expiry (minutes) *</label>
                        <input type="number" id="qr_expiry_minutes" name="qr_expiry_minutes" min="1" max="120" value="{{ form.get('qr_expiry_minutes', '15') if form else '15' }}">
                        <small class="form-hint">How long the QR code remains valid for scanning</small>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="start_time">Session Start Time *</label>
                        <input type="time" id="start_time" name="start_time" required value="{{ form.get('start_time', '') if form else '' }}">
                    </div>
                    <div class="form-group">
                        <label for="end_time">Session End Time *</label>
                        <input type="time" id="end_time" name="end_time" required value="{{ form.get('end_time', '') if form else '' }}">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Create Session & Generate QR</button>
                    <a href="{{ url_for('faculty.sessions_list') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
