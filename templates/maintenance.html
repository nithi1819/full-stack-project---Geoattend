{% extends "base.html" %}
{% block nav %}
<a href="/maintenance" class="nav-link active"> My Dashboard</a>
{% endblock %}
{% block content %}
<div class="page-header"><h1>Maintenance Dashboard</h1><p class="text-muted">Your assigned complaints</p></div>
<div class="stats-grid" id="stats"><div class="loading">Loading...</div></div>
<div class="card mt-6"><h3>Assigned Complaints</h3><div id="complaints"><div class="loading">Loading...</div></div></div>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  const d = await api('/api/dashboard/maintenance');
  if (!d) return;
  const a = d.assignments || [];
  document.getElementById('stats').innerHTML = `
    <div class="stat-card center"><div class="stat-value text-brand">${a.length}</div><div class="stat-label">Total Assigned</div></div>
    <div class="stat-card center"><div class="stat-value text-amber">${a.filter(x=>x.status!=='RESOLVED').length}</div><div class="stat-label">Pending</div></div>
    <div class="stat-card center"><div class="stat-value text-green">${a.filter(x=>x.status==='RESOLVED').length}</div><div class="stat-label">Resolved</div></div>
  `;
  document.getElementById('complaints').innerHTML = a.length ? a.map(c => `
    <div class="complaint-card">
      <div class="complaint-header">
        <span><strong>${c.category}</strong> <span class="badge badge-${c.complaint_status==='RESOLVED'?'green':'yellow'}">${c.complaint_status?.replace(/_/g,' ')}</span> <span class="badge badge-${c.priority==='HIGH'||c.priority==='CRITICAL'?'red':'gray'}">${c.priority}</span></span>
      </div>
      <p class="text-muted">${c.location}</p>
      <p>${c.description}</p>
      <p class="text-sm text-muted">Reported by: ${c.first_name} ${c.last_name}</p>
      <div class="btn-group mt-2">
        ${c.status!=='IN_PROGRESS'?`<button class="btn btn-secondary btn-sm" onclick="updateStatus('${c.complaint_id}','IN_PROGRESS')">Start Work</button>`:''}
        ${c.status!=='RESOLVED'?`<button class="btn btn-primary btn-sm" onclick="updateStatus('${c.complaint_id}','RESOLVED')">Mark Resolved</button>`:''}
      </div>
    </div>
  `).join('') : '<p class="empty">No complaints assigned</p>';
}
async function updateStatus(id, status) {
  await api(`/api/complaints/${id}/status`, 'PUT', {status});
  load();
}
load();
</script>
{% endblock %}
