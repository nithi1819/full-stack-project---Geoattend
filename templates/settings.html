{% extends "base.html" %}
{% block nav %}
<a href="/admin" class="nav-link"> Dashboard</a>
<a href="/admin/settings" class="nav-link active"> Settings</a>
<a href="/admin/users" class="nav-link"> Users</a>
{% endblock %}
{% block content %}
<div class="page-header"><h1>System Settings</h1></div>
<div class="grid-2col">
  <div class="card"><h3>Attendance Thresholds</h3>
    <div class="form-group"><label>Warning Threshold (%)</label><input type="number" id="warning_threshold" class="form-control" value="75"></div>
    <div class="form-group"><label>Critical Threshold (%)</label><input type="number" id="critical_threshold" class="form-control" value="65"></div></div>
  <div class="card"><h3>QR Settings</h3>
    <div class="form-group"><label>QR Rotation (seconds)</label><input type="number" id="qr_rotation_seconds" class="form-control" value="30"></div>
    <div class="form-group"><label>No-Show Window (min)</label><input type="number" id="no_show_minutes" class="form-control" value="15"></div></div>
  <div class="card"><h3>OD Limits</h3>
    <div class="form-group"><label>Max OD Days/Semester</label><input type="number" id="max_od_days" class="form-control" value="5"></div>
    <div class="form-group"><label>Max OD Periods/Semester</label><input type="number" id="max_od_periods" class="form-control" value="10"></div></div>
</div>
<button class="btn btn-primary mt-6" onclick="saveSettings()">Save Settings</button>
<span id="saveMsg" class="text-green ml-4" style="display:none"> Saved!</span>
{% endblock %}
{% block scripts %}
<script>
async function load(){
  const s=await api('/api/settings');
  Object.entries(s).forEach(([k,v])=>{const el=document.getElementById(k);if(el)el.value=v;});
}
async function saveSettings(){
  const data={};['warning_threshold','critical_threshold','qr_rotation_seconds','no_show_minutes','max_od_days','max_od_periods'].forEach(k=>{data[k]=document.getElementById(k).value;});
  await api('/api/settings','POST',data);
  document.getElementById('saveMsg').style.display='inline';
  setTimeout(()=>{document.getElementById('saveMsg').style.display='none';},3000);
}
load();
</script>
{% endblock %}
